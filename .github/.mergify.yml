pull_request_rules:
  - name: Automatically open v5.5 backport PR
    conditions:
      - base=main
      - label="pr-backport-to/v5.5"
    actions:
      backport:
        branches:
          - release/v5.5
        assignees:
          - "{{ author }}"

  - name: Automatically open v5.4 backport PR
    conditions:
      - base=main
      - label="pr-backport-to/v5.4"
    actions:
      backport:
        branches:
          - release/v5.4
        assignees:
          - "{{ author }}"

  # Auto-merge rules for main branch
  - name: Automatically merge Renovate PRs (main)
    conditions:
      - base=main
      - check-success="CI / unitest"
      - check-success="CI / golangci-lint"
      - check-success="CI / openapi-lint"
      - author=renovate[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  - name: Automatically merge Backport PRs (main)
    conditions:
      - base=main
      - check-success="CI / unitest"
      - check-success="CI / golangci-lint"
      - check-success="CI / openapi-lint"
      - author=mergify[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  # Auto-merge rules for v5.5 release branch
  - name: Automatically merge Renovate PRs (v5.5)
    conditions:
      - base=release/v5.5
      - check-success=unitest
      - check-success=golangci
      - author=renovate[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  - name: Automatically merge Backport PRs (v5.5)
    conditions:
      - base=release/v5.5
      - check-success=unitest
      - check-success=golangci
      - author=mergify[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  # Auto-merge rules for v5.4 release branch
  - name: Automatically merge Renovate PRs (v5.4)
    conditions:
      - base=release/v5.4
      - check-success=unitest
      - check-success=golangci
      - author=renovate[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  - name: Automatically merge Backport PRs (v5.4)
    conditions:
      - base=release/v5.4
      - check-success=unitest
      - check-success=golangci
      - author=mergify[bot]
      - -conflict
    actions:
      merge:
        method: rebase

  # Auto-approve rules for main branch
  - name: Automatically approve Renovate PRs (main)
    conditions:
      - base=main
      - check-success="CI / unitest"
      - check-success="CI / golangci-lint"
      - check-success="CI / openapi-lint"
      - author=renovate[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  - name: Automatically approve Backport PRs (main)
    conditions:
      - base=main
      - check-success="CI / unitest"
      - check-success="CI / golangci-lint"
      - check-success="CI / openapi-lint"
      - author=mergify[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  # Auto-approve rules for v5.5 release branch
  - name: Automatically approve Renovate PRs (v5.5)
    conditions:
      - base=release/v5.5
      - check-success=unitest
      - check-success=golangci
      - author=renovate[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  - name: Automatically approve Backport PRs (v5.5)
    conditions:
      - base=release/v5.5
      - check-success=unitest
      - check-success=golangci
      - author=mergify[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  # Auto-approve rules for v5.4 release branch
  - name: Automatically approve Renovate PRs (v5.4)
    conditions:
      - base=release/v5.4
      - check-success=unitest
      - check-success=golangci
      - author=renovate[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  - name: Automatically approve Backport PRs (v5.4)
    conditions:
      - base=release/v5.4
      - check-success=unitest
      - check-success=golangci
      - author=mergify[bot]
      - -conflict
    actions:
      review:
        type: APPROVE

  - name: Ask to resolve conflict
    conditions:
      - conflict
    actions:
      comment:
        message: This pull request is now in conflict. Could you fix it @{{author}}?
